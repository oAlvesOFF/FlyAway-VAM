[package]
name = "sim-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["ASA-ACARS contributors", "noxxr"]
description = "Simulator-agnostic abstractions: SimAdapter trait, SimSnapshot, flight-phase FSM"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
